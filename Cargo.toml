[package]
name = "tincan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.15"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
rmcp = { version = "3.11", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
rsa = "0.9"
